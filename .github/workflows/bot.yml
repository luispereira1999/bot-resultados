name: Bot Resultados

# Verificação contínua: de hora a hora arranca uma corrida que fica a verificar de 2 em 2 minutos
# durante cerca de 65 minutos. Como só corre uma de cada vez, a seguinte fica à espera e arranca
# assim que a anterior acaba, por isso os atrasos do agendador do GitHub não criam buracos.

on:
  schedule:
    # horas em UTC; o bot decide sozinho o que fazer consoante a hora de Lisboa
    - cron: "5 * * * 1-5"    # seg a sex, todas as horas
    - cron: "5 0,1 * * 6"    # sábado de madrugada: relatórios de sexta à noite
    - cron: "37 9 * * 6"     # sábado de manhã: revisão semanal (uma só passagem)
  workflow_dispatch:
    inputs:
      comando:
        description: O que correr
        type: choice
        default: continuo
        options: [continuo, auto, manha, verificar, premarket, rever, teste]

permissions:
  contents: write
  actions: write   # para a corrida contínua lançar a seguinte

concurrency:
  group: bot-resultados
  cancel-in-progress: false

env:
  MINUTOS_CICLO: 65
  SEGUNDOS_ENTRE_VERIFICACOES: 120

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Correr o bot
        env:
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMANDO: ${{ inputs.comando || (github.event.schedule == '37 9 * * 6' && 'auto') || 'continuo' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          guardar() {  # guarda o estado e o registo no repositório, se mudaram
            git add -A data
            git diff --cached --quiet && return 0
            git commit -q -m "Atualiza dados do bot"
            git pull -q --rebase || true
            git push -q || echo "::warning::Não consegui guardar os dados; tento na próxima passagem"
          }

          if [ "$COMANDO" != "continuo" ]; then
            resultado=0
            python bot.py "$COMANDO" || resultado=$?
            guardar
            exit $resultado
          fi

          fim=$((SECONDS + MINUTOS_CICLO * 60))
          total=0; falhas=0
          while [ $SECONDS -lt $fim ]; do
            total=$((total + 1))
            python bot.py auto || falhas=$((falhas + 1))
            guardar
            sleep "$SEGUNDOS_ENTRE_VERIFICACOES"
          done
          echo "Passagens: $total, com falhas: $falhas"

          # Lança já a corrida seguinte (fica em fila e arranca quando esta acabar), para não depender
          # do agendador do GitHub, que se atrasa. Só de seg a sex e sábado de madrugada (hora de Lisboa).
          dia=$(TZ=Europe/Lisbon date +%u); hora=$(TZ=Europe/Lisbon date +%-H)
          if [ "$dia" -le 5 ] || { [ "$dia" -eq 6 ] && [ "$hora" -lt 2 ]; }; then
            gh workflow run bot.yml -f comando=continuo || echo "::warning::Não consegui lançar a corrida seguinte"
          fi

          # só marca a corrida como falhada (e manda email) se mais de metade das passagens falhou
          [ $((falhas * 2)) -le $total ]
